# YAML sample: CI configuration
name: build

on:
  push:
    branches: [main, "release/**"]
  pull_request:

env:
  NODE_VERSION: 20
  DEBUG: false

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest
      - name: Run tests
        run: |
          bun install
          bun test
      - name: Send notification
        if: ${{ failure() }}
        run: echo "Build failed on ${{ matrix.os }}"

defaults: &defaults
  retries: 3
  timeout: 30.5

service:
  <<: *defaults
  url: "https://example.com"
  empty: ~
